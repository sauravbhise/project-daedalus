# Runs on every `git commit`. Install once with: uv run --directory backend pre-commit install
# After installing, run `uv run --directory backend pre-commit autoupdate` to pin the latest hook versions.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  # Secret scanner: blocks commits that contain API keys or tokens.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Local hooks use the exact tool versions in backend/uv.lock, so commit checks match CI.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        pass_filenames: false
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run --directory backend pyright
        language: system
        pass_filenames: false
        types: [python]
